server {
    listen 7443 ssl;
    ssl_certificate     /certs/tidalcase.crt;
    ssl_certificate_key /certs/tidalcase.key;

    # Per-instance VNC proxy blocks (written by the agent at container start)
    include /etc/nginx/conf.d/instances/*.conf;

    # Agent API — internal HTTP to Flask on Docker network
    location / {
        proxy_pass         http://tidalcase-agent:7272;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_connect_timeout 10s;
        client_max_body_size 4G;
    }
}
