<div class="p-6">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-3xl font-semibold text-surface-900 dark:text-surface-0" translate>menu.adminLogs</h1>
        <div class="flex gap-2">
            <p-select [options]="levelOptions" [(ngModel)]="selectedLevel" optionLabel="label" optionValue="value" placeholder="Filtra livello" (ngModelChange)="page.set(1); load()" styleClass="w-36"></p-select>
            <p-button icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="load()"></p-button>
        </div>
    </div>

    <p-card>
        @if (loading()) {
            <p-skeleton height="12rem" styleClass="w-full"></p-skeleton>
        } @else {
            <p-table [value]="logs()" styleClass="p-datatable-sm" [tableStyle]="{'min-width': '40rem'}">
                <ng-template #header>
                    <tr>
                        <th class="w-40">Timestamp</th>
                        <th class="w-24">Livello</th>
                        <th>Messaggio</th>
                    </tr>
                </ng-template>
                <ng-template #body let-log>
                    <tr>
                        <td class="text-xs text-surface-500 font-mono">{{ log.created_at }}</td>
                        <td><p-tag [value]="log.level" [severity]="getLevelSeverity(log.level)" styleClass="text-xs"></p-tag></td>
                        <td class="text-sm font-mono break-all">{{ log.message }}</td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr><td colspan="3" class="text-center text-surface-500 py-8">Nessun log trovato</td></tr>
                </ng-template>
            </p-table>

            <p-paginator
                [rows]="perPage()"
                [totalRecords]="totalRecords()"
                [rowsPerPageOptions]="[25, 50, 100]"
                (onPageChange)="onPageChange($event)"
                styleClass="mt-2">
            </p-paginator>
        }
    </p-card>
</div>
