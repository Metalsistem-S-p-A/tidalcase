<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4" translate>
                        auth.resetPassword
                    </div>
                    <span class="text-surface-600 dark:text-surface-200 font-medium" translate>
                        auth.resetPasswordDescription
                    </span>
                </div>

                <div>
                    <label for="newPassword" class="block text-surface-900 dark:text-surface-0 text-xl font-medium"
                        translate>auth.newPassword</label>
                    <p-password id="newPassword" [(ngModel)]="newPassword"
                        [placeholder]="'auth.newPassword' | translate" [toggleMask]="true" styleClass="mb-5"
                        [fluid]="true" [feedback]="true" class="w-full mb-5"></p-password>

                    <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 text-xl font-medium"
                        translate>
                        auth.confirmPassword
                    </label>
                    <p-password id="confirmPassword" [(ngModel)]="confirmPassword"
                        [placeholder]="'auth.confirmPassword' | translate" [toggleMask]="true" styleClass="mb-5"
                        [fluid]="true" [feedback]="false" class="w-full mb-5" (keyup.enter)="resetPassword()">
                    </p-password>

                    @if (message) {
                    <p-message [severity]="messageType" [text]="message | translate"
                        styleClass="w-full mb-5"></p-message>
                    }

                    <p-button [label]="'auth.resetPassword' | translate" icon="pi pi-lock-open" styleClass="w-full mt-2"
                        (onClick)="resetPassword()" [loading]="isLoading"></p-button>

                    <div class="text-center mt-6">
                        <a routerLink="/auth/login" class="text-primary-600 hover:underline" translate>
                            auth.backToLogin
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
